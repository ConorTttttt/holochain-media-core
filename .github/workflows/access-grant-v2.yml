name: Access Grant v2 cross-language contract

on:
  pull_request:
    paths:
      - "crates/content-core/**"
      - ".github/workflows/access-grant-v2.yml"
  workflow_dispatch:

jobs:
  rust-python-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out Media Core
        uses: actions/checkout@v4
      - name: Check out companion Music v2 branch
        uses: actions/checkout@v4
        with:
          repository: ConorTttttt/holochain-music
          ref: feat/access-grant-v2-agent6
          path: music
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install Music cryptography and test dependencies
        run: python -m pip install -e ./music
      - name: Run independent Python grant security tests
        run: PYTHONPATH=./music python -m unittest discover -s music/tests -p test_access_grant_v2.py -v
      - name: Generate fresh independent cross-language vectors
        run: |
          PYTHONPATH=./music python music/scripts/generate_music_access_grant_v2_vectors.py > "$GITHUB_WORKSPACE/music-access-grant-v2-vectors.json"
          python -m json.tool "$GITHUB_WORKSPACE/music-access-grant-v2-vectors.json" > /dev/null
      - name: Run Media Core Rust suite against independent Python vectors
        run: |
          export MUSIC_ACCESS_GRANT_V2_VECTORS="$GITHUB_WORKSPACE/music-access-grant-v2-vectors.json"
          cargo test -p holochain-content-core --all-features
      - name: Preserve independently generated vectors
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: music-access-grant-v2-vectors
          path: music-access-grant-v2-vectors.json
          if-no-files-found: ignore
