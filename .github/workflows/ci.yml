name: Rust workspace

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace --all-targets
      - name: Test with serde_json preserve_order (feature-unification guard)
        # Holochain's dependency tree enables serde_json/preserve_order. S1
        # canonical JSON must not depend on serde_json map ordering.
        run: cargo test --workspace --all-targets --features serde_json/preserve_order

  music-python-interop:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Core
        uses: actions/checkout@v4
      - name: Checkout exact Music S1 reference
        uses: actions/checkout@v4
        with:
          repository: ConorTttttt/holochain-music
          ref: bd7aabc3e9ea1fef1e8e8f674301e1b5ffecb637
          path: target/music-reference
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install reference package crypto dependency
        run: python -m pip install 'cryptography==46.0.4'
      - name: Generate independent signed S1 reference vectors
        run: |
          python scripts/generate_music_vectors.py \
            --music-repo target/music-reference \
            --output target/music-golden-vectors.json
      - name: Generate fresh CORE-005 grant/licence vectors with Music's own issuer
        run: |
          python scripts/generate_music_entitlement_vectors.py \
            --music-repo target/music-reference \
            --output target/music-entitlement-vectors.json
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Rust cross-language signature, digest and negative tests
        env:
          MUSIC_VECTORS: target/music-golden-vectors.json
          MUSIC_ENTITLEMENT_VECTORS: target/music-entitlement-vectors.json
        run: cargo test --workspace --features holochain-content-core/music-interop-tests --all-targets
      - name: Cross-language tests with serde_json preserve_order
        env:
          MUSIC_VECTORS: target/music-golden-vectors.json
          MUSIC_ENTITLEMENT_VECTORS: target/music-entitlement-vectors.json
        run: cargo test -p holochain-content-core --features music-interop-tests,serde_json/preserve_order --all-targets

  music-s2-identity-interop:
    # S2 key-binding v2 and key-lifecycle v2.1 vectors, regenerated from
    # Music's own Python at the exact commits the committed vectors came
    # from. The S1 and CORE-005 references above are not changed.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Core
        uses: actions/checkout@v4
      - name: Checkout Music S2 v2 reference (key-binding v2 implementation)
        uses: actions/checkout@v4
        with:
          repository: ConorTttttt/holochain-music
          ref: f091d5a5da0c2cb46228ea619ab816338311ef9b
          path: target/music-s2-v2
          persist-credentials: false
      - name: Checkout Music S2 v2.1 reference (key lifecycle implementation)
        uses: actions/checkout@v4
        with:
          repository: ConorTttttt/holochain-music
          ref: cfd48073dec341c6b89339c91026799218644c0a
          path: target/music-s2-v21
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install reference package crypto dependency
        run: python -m pip install 'cryptography==46.0.4'
      - name: Generate key-binding v2 vectors with Music's own code
        run: |
          python scripts/generate_music_key_binding_vectors.py \
            --music-repo target/music-s2-v2 --output target/kb-v2.json
      - name: Generate key-lifecycle v2.1 and replica-receipt/v2 vectors with Music's own code
        run: |
          python scripts/generate_music_key_lifecycle_vectors.py \
            --music-repo target/music-s2-v21 --output target/kl-v21.json
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Rust verdicts equal Music's on fresh vectors
        env:
          MUSIC_KEY_BINDING_VECTORS: target/kb-v2.json
          MUSIC_KEY_LIFECYCLE_VECTORS: target/kl-v21.json
        run: cargo test -p holochain-content-core --all-targets
      - name: Same with serde_json preserve_order
        env:
          MUSIC_KEY_BINDING_VECTORS: target/kb-v2.json
          MUSIC_KEY_LIFECYCLE_VECTORS: target/kl-v21.json
        run: cargo test -p holochain-content-core --features serde_json/preserve_order --all-targets
      - name: Deterministic part of the committed v2.1 vectors reproduces exactly
        # Lifecycle records are Ed25519 (deterministic) over fixed test keys;
        # packages, receipts and grants use fresh random content keys/nonces.
        run: |
          python - <<'PY'
          import json
          a = json.load(open("crates/content-core/testdata/music-key-lifecycle-v21-vectors.json"))
          b = json.load(open("target/kl-v21.json"))
          for k in ("scenarios", "lifecycle", "keys", "agents", "dna_hash", "music_commit"):
              assert a[k] == b[k], f"committed vectors differ from a fresh Music run: {k}"
          for k in ("rotation_successor_hex", "rotation_predecessor_hex"):
              assert a["messages"][k] == b["messages"][k], k
          print("deterministic v2.1 vectors reproduce exactly")
          PY

  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Check native Windows compilation and unit tests
        run: cargo test --workspace --all-targets
