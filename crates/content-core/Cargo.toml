[package]
name = "holochain-content-core"
description = "Typed identifiers and Python Music S1 verification contracts"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false

[lib]
name = "holochain_content_core"
path = "src/lib.rs"

[features]
default = []
music-interop-tests = []
preserve-order-tests = ["serde_json/preserve_order"]

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["std"] }
ed25519-dalek = "2.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
